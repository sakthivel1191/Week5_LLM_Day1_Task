<!DOCTYPE html>
<html >
<head>
    
    <title>LLM Streaming Chat</title>
    <style>
        body{
            font-family: Arial;
            margin: 40px;
            background: #f2f2f2;
        }
        .container{
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 700px;
            margin: auto;
        }
        textarea{
            width: 100%;
            height: 100px;
            padding: 10px;
        }
        button{
            padding: 12px 25px;
            background:blue;
            color:white;
            border: none;
            cursor: pointer;
        }
        #output{
            margin-top: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        </style>
</head>
<body>
<div class="container">
    <h2>LLM Streaming Chat</h2>
    <textarea
        id="message"
        placeholder="Enter your question..."
    ></textarea>
    <br><br>
    <button onclick="sendMessage()">
        Send Message
    </button>
    <h3>AI Response:</h3>
    <div id="output"></div>
</div>
<script>
    async function sendMessage(){
        const message=document.getElementById("message").value;
        const output=document.getElementById("output")
        output.innerText="";
        try{
            const response=await fetch(
                "http://127.0.0.1:8000/chat/stream",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        message:message
                    })
                }
            );
            if (!response.ok){
                throw new Error(await response.text());
            }
            const reader=response.body.getReader();
            const decoder=new TextDecoder();
            let buffer="";
            while(true){
                const result=await reader.read();
                if (result.done){
                    break;
                }
                buffer+=decoder.decode(
                    result.value,
                    {stream:true}
                );
                const events=buffer.split("\n\n");
                buffer=events.pop();
                for(const event of events){
                    if(event.includes("data:[DONE]")){
                        output.innerText+="\n\nFinished!";
                        return;
                }
                if (event.startsWith("event:error")){
                    throw new Error(event);
                }
                const dataLine=event
                    .split("\n")
                    .find(line=>line.startsWith("data:"));
                if (dataLine){
                    const data=JSON.parse(dataLine.substring(5).trim());
                    output.innerText+=data.content||"";
                }
            }
        }
    } catch(error){
        output.innerText+="\nError:"+error.message;
    }
}
</script>
</body>
</html>
